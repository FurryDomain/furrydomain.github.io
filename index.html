<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>FurryDomain</title>
  <meta name="description" content="FurryDomain 工作室官方网站，正在建设中。">
  <link rel="icon" href="assets/logo.jpg">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
        Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(40px + env(safe-area-inset-top)) 24px
        calc(40px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo {
      display: block;
      width: 180px;
      height: 180px;
    }

    h1 {
      margin: 18px 0 0;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.15;
    }

    .status {
      margin: 12px 0 0;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      color: #86868b;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 148px;
        height: 148px;
      }

      h1 {
        margin-top: 14px;
        font-size: 28px;
      }

      .status {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="logo" src="assets/logo.jpg" alt="FurryDomain 工作室标志" width="180" height="180">
    <h1>FurryDomain</h1>
    <p class="status">官网建设中...</p>
  </main>
</body>
</html>
